<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Retail POS Mobile — A clearer way to run the counter</title>
  <desc id="desc">Warm ivory and amber editorial artwork for an Android retail point-of-sale project in development.</desc>
  <rect width="1200" height="630" fill="#faf9f5"/>
  <text x="64" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#191a18">ANDROID RETAIL / IN DEVELOPMENT</text>
  <text x="60" y="215" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="800" letter-spacing="-5" fill="#191a18">A clearer way</text>
  <rect x="60" y="238" width="540" height="100" rx="3" fill="#ffc629"/>
  <text x="76" y="311" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="-4" fill="#191a18">to run the counter.</text>
  <text x="66" y="389" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#65665f">An Android-first POS concept for everyday shop work.</text>
  <line x1="66" y1="450" x2="605" y2="450" stroke="#deddd4" stroke-width="2"/>
  <text x="66" y="492" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#475569">RETAIL POS MOBILE</text>
  <text x="66" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#65665f">No public APK is available yet.</text>
  <rect x="682" y="78" width="8" height="470" rx="4" fill="#ffc629"/>
  <rect x="706" y="78" width="430" height="470" rx="18" fill="#20221e"/>
  <rect x="730" y="102" width="36" height="36" rx="9" fill="#ffc629"/>
  <text x="748" y="127" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#191a18">R</text>
  <text x="780" y="116" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fffefa">Retail POS</text>
  <text x="780" y="134" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#b9bbb1">COUNTER / CONCEPT UI</text>
  <line x1="730" y1="158" x2="1112" y2="158" stroke="#4b4d45" stroke-width="1"/>
  <text x="732" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#b9bbb1">CURRENT BASKET</text>
  <text x="732" y="225" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#fffefa">Everyday essentials</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f4f3ed">
    <text x="734" y="270">01</text><text x="778" y="270">Milk · 1 L</text><text x="1108" y="270" text-anchor="end">320</text>
    <text x="734" y="315">02</text><text x="778" y="315">Bread loaf</text><text x="1108" y="315" text-anchor="end">180</text>
    <text x="734" y="360">03</text><text x="778" y="360">Tea pack</text><text x="1108" y="360" text-anchor="end">690</text>
  </g>
  <line x1="730" y1="386" x2="1112" y2="386" stroke="#4b4d45" stroke-width="1"/>
  <text x="732" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b9bbb1">Illustrative total</text>
  <text x="1108" y="424" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="end" fill="#ffc629">PKR 1,190</text>
  <rect x="732" y="450" width="380" height="38" rx="8" fill="#ffc629"/>
  <text x="922" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#191a18">REVIEW SALE · PLANNED</text>
  <text x="732" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b9bbb1">Illustrative only · not a released app</text>
</svg>

name: Website checks

on:
  push:
    branches: [main, "planning/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate content and routes
        run: npm run check:content
      - name: Build static website
        run: npm run build
